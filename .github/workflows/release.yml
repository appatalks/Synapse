name: Prepare release candidate

on:
  push:
    tags: ["v*rc*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  package:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release version
        run: |
          python - <<'PY'
          import os
          from synapse_app import __version__
          assert os.environ["GITHUB_REF_NAME"] == "v" + __version__
          assert "rc" in __version__, "This workflow only prepares release candidates"
          PY
      - name: Build and verify
        run: |
          python scripts/build_synapse.py --output dist
          python tests/test_release.py dist/SYNAPSE.pyz
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(p for p in Path("dist").iterdir() if p.suffix in (".pyz", ".whl"))
          Path("dist/SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          PY
      - name: Create reviewable draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/SYNAPSE.pyz dist/*.whl dist/SHA256SUMS \
            --draft --prerelease --title "SYNAPSE $GITHUB_REF_NAME" \
            --notes "Cross-platform application release candidate. Requires Python 3.10+, a separately installed llama-server, and user-provided GGUF weights. GPU monitoring supports NVIDIA NVML; AMD/Metal sensors are unavailable. The optional Linux/CUDA hybrid engine remains research software and is not quality-qualified. See README and platform notes before publishing this draft."
