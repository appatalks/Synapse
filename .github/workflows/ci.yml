name: Application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Application lifecycle and API
        run: python tests/test_local_app.py synapse_app/app.py
      - name: Native OS monitoring and counter contracts
        run: python tests/test_telemetry.py synapse_app/telemetry.py
      - name: Chat, navigation and monitoring
        run: node --test tests/test_chat_stream.mjs tests/test_monitor.mjs
      - name: Build and exercise the actual zipapp
        run: |
          python scripts/build_synapse.py --output dist
          python tests/test_release.py dist/SYNAPSE.pyz
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --no-deps --no-index --find-links dist synapse-local
          python -I -m synapse_app --version
